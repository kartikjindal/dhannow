# Backend gates (PLAN Phase 12): unit + ArchUnit + JaCoCo, Testcontainers integration (-Pit),
# and the OpenAPI contract. Nothing here touches a cloud account.
name: backend
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Dockerfile.backend*"
      - "docker-compose.ci.yml"
      - "docs/api/openapi.json"
      - "scripts/ci/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile.backend*"
      - "docker-compose.ci.yml"
      - "docs/api/openapi.json"
      - "scripts/ci/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  unit:
    name: unit, ArchUnit, JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: mvn verify (unit tests, ArchUnit rules, JaCoCo 80% engine gate)
        run: sh mvnw -B -ntp verify
      - name: JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-unit
          path: backend/**/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
      - name: Surefire reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-unit
          path: backend/**/target/surefire-reports/
          retention-days: 7

  integration:
    name: integration (-Pit, Testcontainers Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      # ubuntu-latest ships Docker, which Testcontainers uses for postgres:16.
      - name: mvn verify -Pit
        run: sh mvnw -B -ntp verify -Pit
      - name: JaCoCo report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-it
          path: backend/**/target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14
      - name: Surefire reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-it
          path: backend/**/target/surefire-reports/
          retention-days: 7

  openapi:
    name: OpenAPI export + contract diff
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Package the bootable jar
        run: sh mvnw -B -ntp -DskipTests -pl navix-app -am package
      - name: Start Postgres + backend (mock providers)
        working-directory: .
        run: |
          export AUTH_SECRET="$(openssl rand -hex 32)"
          docker compose -f docker-compose.ci.yml up -d --build
          sh scripts/ci/wait_for_url.sh http://localhost:8080/actuator/health 240 UP
      - name: Export /v3/api-docs
        working-directory: .
        run: |
          mkdir -p build
          curl -fsS http://localhost:8080/v3/api-docs -o build/openapi.json
          python3 -c "import json;d=json.load(open('build/openapi.json'));print(len(d.get('paths',{})),'paths')"
      - name: Upload openapi.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi
          path: build/openapi.json
          retention-days: 30
      - name: Diff against docs/api/openapi.json
        working-directory: .
        run: python3 scripts/ci/openapi_diff.py build/openapi.json docs/api/openapi.json
      - name: Backend logs
        if: failure()
        working-directory: .
        run: docker compose -f docker-compose.ci.yml logs --no-color backend | tail -300
