# Security gates (PLAN Phase 12: "No high findings"):
#  - OWASP dependency-check over the backend's Maven dependencies (weekly and on demand; CVSS >= 7
#    fails). Run through the Maven plugin from the command line, so no pom change.
#  - npm audit (high) over the staff console's shipped dependencies (weekly; also on every web PR).
#  - OWASP ZAP baseline (passive) against staging: site, staff console and API (on demand).
# flutter analyze runs in app.yml. gitleaks runs in secrets.yml.
name: security
on:
  schedule:
    - cron: "0 22 * * 0" # Monday 03:30 IST
  workflow_dispatch:
    inputs:
      zap:
        description: Run the ZAP baseline against staging
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-check:
    if: github.event_name == 'schedule' || !inputs.zap
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      # Without an NVD API key the first database download takes hours; add secret NVD_API_KEY.
      - name: dependency-check (aggregate, fail on CVSS >= 7)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          sh mvnw -B -ntp -DskipTests package
          org.owasp:dependency-check-maven:13.0.0:aggregate
          -DfailBuildOnCVSS=7 -Dformats=HTML,JSON
          -DnvdApiKey="$NVD_API_KEY"
          -DossindexAnalyzerEnabled=false
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 30

  npm-audit:
    if: github.event_name == 'schedule' || !inputs.zap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - working-directory: web
        run: npm audit --audit-level=high --omit=dev

  zap:
    if: github.event_name == 'workflow_dispatch' && inputs.zap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        target: [site, staff, api]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Target URL
        id: url
        run: |
          case "${{ matrix.target }}" in
            site)  u="${{ vars.SITE_BASE_URL }}" ;;
            staff) u="${{ vars.STAFF_BASE_URL }}" ;;
            api)   u="${{ vars.API_BASE_URL }}/v3/api-docs" ;;
          esac
          [ -n "$u" ] && [ "${u#/}" = "$u" ] || { echo "::error::set the staging URL variable for ${{ matrix.target }}"; exit 1; }
          echo "url=$u" >> "$GITHUB_OUTPUT"
      # Only rules marked FAIL in .github/zap/rules.tsv fail the job (-I: warnings do not).
      - uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ steps.url.outputs.url }}
          docker_name: zaproxy/zap-stable:2.17.0
          rules_file_name: .github/zap/rules.tsv
          cmd_options: "-I"
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-${{ matrix.target }}
