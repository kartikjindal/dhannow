# Publish site/ to S3 + CloudFront for staging or prod (PLAN Phase 13). Manual only, behind the
# GitHub environment's protection rules. Optionally publishes the signed APKs of an app.yml run.
#
# Environment variables: AWS_REGION, AWS_DEPLOY_ROLE_ARN, SITE_BUCKET, DOWNLOADS_BUCKET,
# CLOUDFRONT_DISTRIBUTION_ID, SITE_BASE_URL (terraform output github_environment_variables).
name: deploy-site
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target
        type: choice
        options: [staging, prod]
        required: true
      app_run_id:
        description: Optional app.yml run id whose app-release-signed APKs to publish under /downloads/
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: deploy-site-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.SITE_BASE_URL }}
    env:
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      DOWNLOADS_BUCKET: ${{ vars.DOWNLOADS_BUCKET }}
      DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # prod: --release refuses the lender, APK and signing-fingerprint placeholders (Phase 10a).
      - name: Site checks
        run: python site/check_all.py ${{ inputs.environment == 'prod' && '--release' || '' }}
      - name: Check the environment is configured
        run: |
          for v in SITE_BUCKET DISTRIBUTION SITE_BASE_URL; do
            [ -n "$(printenv $v)" ] || { echo "::error::$v is not set on '${{ inputs.environment }}'"; exit 1; }
          done

      - uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-site-${{ github.run_id }}

      - name: Sync site/ (build tooling excluded)
        run: |
          set -euo pipefail
          aws s3 sync site/ "s3://$SITE_BUCKET/" --delete \
            --exclude "*.py" --exclude "__pycache__/*" --exclude "page_template.html" \
            --exclude "doc-versions.json" --exclude "parity/*" --exclude ".DS_Store" \
            --cache-control "public, max-age=300"
          # App links: Android fetches this without following redirects and wants JSON.
          aws s3 cp site/.well-known/assetlinks.json "s3://$SITE_BUCKET/.well-known/assetlinks.json" \
            --content-type application/json --cache-control "public, max-age=300"

      - name: Fetch APKs from the app run
        if: inputs.app_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-release-signed
          run-id: ${{ inputs.app_run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Publish APKs under /downloads/
        if: inputs.app_run_id != ''
        run: |
          set -euo pipefail
          [ -n "$DOWNLOADS_BUCKET" ] || { echo "::error::DOWNLOADS_BUCKET is not set"; exit 1; }
          dest="downloads/app/${{ inputs.app_run_id }}"
          find apk -name 'app-*-release.apk' | while read -r f; do
            aws s3 cp "$f" "s3://$DOWNLOADS_BUCKET/$dest/$(basename "$f")" \
              --content-type application/vnd.android.package-archive --cache-control "public, max-age=31536000, immutable"
            echo "- $SITE_BASE_URL/$dest/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          find apk -name SHA256SUMS -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
          echo "Put the URL, version, size and SHA-256 in docs/brand.json app.apk, then rebuild and redeploy the site." >> "$GITHUB_STEP_SUMMARY"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      - name: Smoke check
        run: |
          set -euo pipefail
          curl -fsS "$SITE_BASE_URL/" -o /dev/null
          curl -fsS "$SITE_BASE_URL/download" -o /dev/null
          ct=$(curl -fsS -o /dev/null -w '%{content_type}' "$SITE_BASE_URL/.well-known/assetlinks.json")
          case "$ct" in application/json*) echo "assetlinks.json: $ct";; *) echo "::error::assetlinks.json served as '$ct'"; exit 1;; esac
