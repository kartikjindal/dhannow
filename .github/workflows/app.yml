# Flutter app gates (PLAN Phase 12/13): analyze, test + core/ coverage, API contract, every screen
# rendered on the demo server, release APKs split per ABI under 12 MB each, and the AAB.
# Signing and the Play upload run only when their secrets exist; otherwise the builds stay
# debug-signed and nothing is uploaded.
name: app
on:
  push:
    branches: [main]
    tags: ["app-v*"]
    paths:
      - "app/**"
      - "docs/api/openapi.json"
      - "scripts/ci/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "docs/api/openapi.json"
      - "scripts/ci/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: analyze, test, coverage, contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          # Pin with the repository variable FLUTTER_VERSION (pubspec needs >= 3.47.0).
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: core/ coverage >= 70%
        working-directory: .
        run: >-
          python3 scripts/ci/lcov_gate.py app/coverage/lcov.info lib/core/
          ${{ vars.APP_CORE_COVERAGE_MIN || '70' }}
      - name: App calls exist in the backend API
        working-directory: .
        run: python3 scripts/ci/app_contract_check.py docs/api/openapi.json
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-coverage
          path: app/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  screens:
    name: render every screen (demo server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test tool/screens_test.dart --dart-define=DEMO=true --dart-define=SHOTS=build/screens
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-screens
          path: app/build/screens/
          retention-days: 14

  build:
    name: release APKs (split per ABI) + AAB
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      API_BASE: ${{ vars.APP_API_BASE || 'https://api.dhannow.com' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: flutter build apk --split-per-abi
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=API_BASE="$API_BASE"
          --split-debug-info=build/symbols/apk
      - name: flutter build appbundle
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE="$API_BASE"
          --split-debug-info=build/symbols/aab
      # app/android/app/build.gradle.kts signs release with the debug key (Phase 11). Until it reads
      # an upload key itself, the upload key from GitHub secrets re-signs the outputs here.
      - name: Sign with the upload key
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          ks="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            "$bt/apksigner" verify --print-certs "$apk" | head -3
          done
          aab=build/app/outputs/bundle/release/app-release.aab
          zip -q -d "$aab" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          jarsigner -keystore "$ks" -storepass:env KS_PASS -keypass:env KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 "$aab" "$KEY_ALIAS"
          {
            echo "### Upload key certificate"
            echo '```'
            keytool -list -v -keystore "$ks" -storepass:env KS_PASS -alias "$KEY_ALIAS" | grep -E 'SHA256:'
            echo '```'
            echo "The Play app-signing key's SHA-256 (Play Console) is the one assetlinks.json needs;"
            echo "add this upload key too while the APK is served from dhannow.com (docs/GO_LIVE.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ks"
      - name: Not signed for release
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APKs and AAB are debug-signed and must not be distributed."
      - name: Size gate (< 12 MB per ABI) + SHA-256
        working-directory: .
        run: python3 scripts/ci/apk_size_gate.py app/build/app/outputs/flutter-apk ${{ vars.APK_MAX_MB || '12' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-release-${{ env.HAS_KEYSTORE == 'true' && 'signed' || 'debug-signed' }}
          path: |
            app/build/app/outputs/flutter-apk/app-*-release.apk
            app/build/app/outputs/flutter-apk/SHA256SUMS
            app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-symbols
          path: app/build/symbols/
          retention-days: 90
      # Tag app-vX.Y.Z → Play internal track. The first upload of a new Play app must be manual.
      - name: Upload to Play (internal track)
        if: startsWith(github.ref, 'refs/tags/app-v') && env.HAS_KEYSTORE == 'true' && env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dhannow.app
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
      - name: Play upload skipped
        if: startsWith(github.ref, 'refs/tags/app-v') && (env.HAS_KEYSTORE != 'true' || env.HAS_PLAY != 'true')
        run: |
          echo "::warning::Tag build not uploaded to Play: ANDROID_KEYSTORE_BASE64 and PLAY_SERVICE_ACCOUNT_JSON are both required."
