# Public site gates (PLAN Phase 10a/12): calculator self-check and parity with the ladder fixture,
# one brand config, legal page versions, links and app URLs, theme tokens.
name: site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/brand.json"
      - "CLAUDE.md"
      - "app/lib/core/brand.dart"
      - "app/lib/core/theme/**"
      - "app/lib/core/links.dart"
      - "web/src/lib/brand.ts"
      - "backend/navix-app/src/main/resources/application.yml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/brand.json"
      - "CLAUDE.md"
      - "app/lib/core/brand.dart"
      - "app/lib/core/theme/**"
      - "app/lib/core/links.dart"
      - "web/src/lib/brand.ts"
      - "backend/navix-app/src/main/resources/application.yml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: node site/calc.js (calculator self-check)
        run: node site/calc.js
      - name: node site/parity/calc.test.js (calc.js = ladder.json = LoanMath)
        run: node site/parity/calc.test.js
      - name: python site/check_all.py
        run: python site/check_all.py
