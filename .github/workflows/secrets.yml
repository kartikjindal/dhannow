# The repo is public: every push and PR is scanned for secrets (PLAN Phase 0).
name: secrets
on:
  push:
  pull_request:
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c
          'git config --global --add safe.directory /repo && gitleaks git /repo --redact --no-banner --exit-code 1'
