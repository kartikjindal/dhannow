<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Open the app – DhanNow</title>
<link rel="icon" href="../logo.jpeg">
<style>
/* PLAN Phase 10a W8: dhannow.com/app/open?to=repay|loans|support, the link SMS and email templates use.
   With the app installed Android opens it through the verified app link and this page never loads;
   otherwise it tries the app once and falls back to download.html. */
:root{--page:#F2F3F3;--surface:#FAFAFA;--ink:#0B0B0C;--soft:#4A4D52;--line:#E5E7E8;--cobalt:#1F5BDB;--cobalt-dark:#1A4BB8}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cobalt-dark)}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:3px}
main{max-width:480px;margin:0 auto;padding:48px 16px}
img{height:44px;display:block;margin-bottom:32px}
h1{font-size:26px;line-height:1.25;margin:0 0 8px}
p{margin:0 0 16px;color:var(--soft)}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;background:var(--cobalt);color:#fff;font-weight:600;text-decoration:none;margin:24px 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;margin-top:32px}
.card p{margin:0}
</style>
</head>
<body>
<main>
<img src="../logo.jpeg" alt="DhanNow">
<h1>Opening the DhanNow app</h1>
<p>Your loan, repayments and help are all in the app.</p>
<a class="btn" id="open" data-app-intent="/app/open" data-fallback="download.html" href="intent://dhannow.com/app/open#Intent;scheme=https;package=com.dhannow.app;S.browser_fallback_url=https%3A%2F%2Fdhannow.com%2Fdownload.html;end">Open DhanNow app</a>
<p>If nothing happens, open the DhanNow app yourself.</p>
<div class="card"><p>Don’t have the app on this phone? <a href="../download.html">Download DhanNow</a></p></div>
</main>
<script>
(function () {
  // Only these screens can be asked for; anything else opens the app's home.
  var m = /[?&]to=(repay|loans|support)(&|$)/.exec(location.search);
  var a = document.getElementById('open');
  if (m) a.href = a.href.replace('/app/open#', '/app/open?to=' + m[1] + '#');
  // Browsers without intent:// support (and phones without the app, outside Chrome) end up on download.html.
  setTimeout(function () { if (!document.hidden) location.href = '../download.html'; }, 2500);
  location.href = a.href;
})();
</script>
</body>
</html>
